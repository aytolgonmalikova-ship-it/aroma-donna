<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AROMA DONNA — интернет-магазин премиальной парфюмерии в Кыргызстане (учебный проект)" />
    <meta name="theme-color" content="#f6e7e4" />
    <title>AROMA DONNA — премиальная парфюмерия</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Применяем тему ДО загрузки React, чтобы не было «вспышки» светлой темы.
      (function () {
        try {
          var saved = localStorage.getItem('aroma_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved === 'light' || saved === 'dark' ? saved : prefersDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Для работы магазина включите JavaScript.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
